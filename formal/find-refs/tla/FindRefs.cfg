\* Original code. Checks the three requested properties plus the extras; TLC stops at the first
\* violation (use run.sh / matrix.sh for one-property-per-run shortest traces).
SPECIFICATION Spec
CONSTANTS
  Refs <- DefaultRefs
  Fixes <- NoFixes
  Planted = FALSE
  MaxRuns = 2
  MaxSwitch = 2
INVARIANTS
  TypeOK
  NoLostRoot NoLostRef
  OneRootPerUri OneRootCreated NoDupRef
  NoStale NoForeign
  NoCME NoDeadlock
